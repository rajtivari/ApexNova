# Free development deployment for the ApexNova API.
# Supabase provides the PostgreSQL database separately.
# Free Render services may sleep when idle and are for testing, not production.
services:
  - type: web
    name: apexnova-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://rajtivari.github.io
      - key: TRUST_PROXY
        value: "true"
