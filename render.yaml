# Render Blueprint for the ApexNova API + PostgreSQL.
# Deploy from https://render.com/deploy?repo=https://github.com/rajtivari/ApexNova
services:
  - type: web
    name: apexnova-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apexnova-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://rajtivari.github.io
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: apexnova-db
    databaseName: apexnova
    user: apexnova
    plan: basic-256mb
    region: singapore
