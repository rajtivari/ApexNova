name: Validate ApexNova API

on:
  push:
    branches: [main, "fix/backend-foundation-audit"]
    paths:
      - "apps/api/**"
      - ".github/workflows/validate-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/validate-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-api:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apexnova
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apexnova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apexnova"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Check JavaScript syntax
        working-directory: .
        run: find apps/api/src apps/api/scripts apps/api/tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run unit tests
        run: npm test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Build production API image
        run: docker build -t apexnova-api .
